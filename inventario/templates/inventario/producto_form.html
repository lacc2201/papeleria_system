{% extends 'inventario/base.html' %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card border-0 shadow-lg">

                <div class="card-body p-4 p-md-5">

                    <!-- HEADER -->

                    <div class="d-flex justify-content-between align-items-center mb-4">

                        <div>

                            <h2 class="fw-bold mb-1">
                                Nuevo Producto
                            </h2>

                            <p class="text-muted mb-0">
                                Registra un producto fácilmente
                            </p>

                        </div>

                        <!-- BOTÓN X -->

                        <a href="{% url 'productos' %}"
                           class="btn btn-light rounded-circle shadow-sm d-flex align-items-center justify-content-center"
                           style="
                                width:45px;
                                height:45px;
                                font-size:22px;
                           ">

                            ✕

                        </a>

                    </div>

                    <!-- FORMULARIO -->

                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Nombre del producto
                            </label>

                            {{ form.nombre }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Categoría
                            </label>

                            {{ form.categoria }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Precio de venta
                            </label>

                            {{ form.precio_venta }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Cantidad
                            </label>

                            {{ form.cantidad }}

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Imagen del producto
                            </label>

                            {{ form.imagen }}

                        </div>

                        <!-- BOTÓN -->

                        <button class="btn btn-primary btn-lg w-100">

                            Guardar Producto

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
