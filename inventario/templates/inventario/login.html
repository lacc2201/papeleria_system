<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            min-height:100vh;
            background: linear-gradient(135deg,#0d6efd,#6610f2);
            display:flex;
            justify-content:center;
            align-items:center;
            font-family: Arial, sans-serif;
        }

        .login-card{
            width:100%;
            max-width:420px;
            border:none;
            border-radius:25px;
            overflow:hidden;
            background:white;
        }

        .login-header{
            padding:40px 30px 10px;
            text-align:center;
        }

        .login-body{
            padding:30px;
        }

        .form-control{
            height:50px;
            border-radius:12px;
        }

        .btn-login{
            height:50px;
            border-radius:12px;
            font-weight:bold;
            font-size:18px;
        }

    </style>

</head>

<body>

<div class="card shadow-lg login-card">

    <div class="login-header">

        <h1 class="fw-bold">
            📦 Inventario
        </h1>

        <p class="text-muted">
            Sistema para papelería y miscelánea
        </p>

    </div>

    <div class="login-body">

        <!-- ERRORES -->

        {% if form.errors %}

            <div class="alert alert-danger">

                Usuario o contraseña incorrectos.

            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Usuario
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Ingresa tu usuario"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Ingresa tu contraseña"
                    required
                >

            </div>

            <button type="submit"
                    class="btn btn-primary w-100 btn-login">

                Entrar

            </button>

        </form>

    </div>

</div>

</body>
</html>
