{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inventario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'css/styles.css' %}">

</head>

<body>

<!-- NAVBAR MÓVIL -->

<nav class="navbar navbar-dark bg-dark d-lg-none">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold"
           href="/">

            📦 Inventario

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#mobileMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

    </div>

</nav>

<!-- SIDEBAR MÓVIL -->

<div class="offcanvas offcanvas-start bg-dark text-white"
     tabindex="-1"
     id="mobileMenu">

    <div class="offcanvas-header">

        <h5 class="offcanvas-title">
            Menú
        </h5>

        <button type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="offcanvas">

        </button>

    </div>

    <div class="offcanvas-body">

        <a href="/"
           class="sidebar-link">

            Dashboard

        </a>

        <a href="/productos/"
           class="sidebar-link">

            Productos

        </a>

        <a href="/ventas/"
           class="sidebar-link">

            Ventas

        </a>

        <a href="/admin/"
           class="sidebar-link">

            Admin

        </a>

        <form action="{% url 'logout' %}"
              method="POST">

            {% csrf_token %}

            <button class="btn btn-danger w-100 mt-4">

                Cerrar sesión

            </button>

        </form>

    </div>

</div>

<div class="d-flex">

    <!-- SIDEBAR PC -->

    <div class="sidebar d-none d-lg-block">

        <div class="p-4">

            <h3 class="fw-bold text-white mb-4">

                📦 Inventario

            </h3>

            <a href="/"
               class="sidebar-link">

                Dashboard

            </a>

            <a href="/productos/"
               class="sidebar-link">

                Productos

            </a>

            <a href="/ventas/"
               class="sidebar-link">

                Ventas

            </a>

            <a href="/admin/"
               class="sidebar-link">

                Admin

            </a>

            <form action="{% url 'logout' %}"
                  method="POST">

                {% csrf_token %}

                <button class="btn btn-danger w-100 mt-4">

                    Cerrar sesión

                </button>

            </form>

        </div>

    </div>

    <!-- CONTENIDO -->

    <div class="content flex-grow-1">

        <div class="container-fluid py-4 px-3 px-md-4">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
